[project]
name = "api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "shared-proto",
]

[project.scripts]
api-gateway = "api_gateway:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Tell uv to look up shared-proto from the monorepo workspace definition
shared-proto = { workspace = true }
